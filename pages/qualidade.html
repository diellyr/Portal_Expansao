<!doctype html>
<html lang="pt-BR">
<head>
  <script>(function(){try{if(localStorage.getItem("portal_expansao_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Qualidade dos Cadastros — Portal Expansão</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/tables.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main-content" id="main-content">
        <div class="page-header">
          <h2 class="page-header-title">Central de Qualidade dos Cadastros</h2>
          <p class="page-header-subtitle">
            Análise automática dos cadastros já existentes -- nada aqui é alterado sozinho. Cada indicador é um alerta
            para revisão manual; use "Abrir cadastro" para corrigir o que for necessário.
          </p>
        </div>

        <section aria-label="Indicadores">
          <div class="grid grid-cards" id="quality-cards"></div>
        </section>

        <section aria-label="Detalhamento" style="margin-top: var(--space-5);">
          <div class="wizard-steps" id="quality-tabs"></div>
          <div id="quality-content"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="../js/pages/qualidade.js"></script>
</body>
</html>
