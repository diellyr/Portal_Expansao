<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios — Portal Expansão</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/tables.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main-content" id="main-content">
        <div class="page-header">
          <h2 class="page-header-title">Relatórios</h2>
          <p class="page-header-subtitle">Análises regionais e por cidade com exportação em CSV, Excel e impressão.</p>
        </div>

        <section aria-label="Filtros dos relatórios">
          <div id="global-filters"></div>
          <div class="surface filter-bar" style="margin-top: var(--space-3);">
            <div class="filter-field">
              <label for="filter-completude">Dados</label>
              <select id="filter-completude" class="form-control">
                <option value="all">Todos os cadastros</option>
                <option value="completos">Somente completos</option>
                <option value="incompletos">Somente incompletos</option>
              </select>
            </div>
            <div class="filter-field" id="month-field" hidden>
              <label for="filter-month">Mês (aniversariantes)</label>
              <select id="filter-month" class="form-control"></select>
            </div>
            <div class="filter-actions">
              <button type="button" class="btn btn-secondary" id="clear-filters-btn">Limpar filtros</button>
              <button type="button" class="btn btn-primary" id="apply-filters-btn">Aplicar filtros</button>
            </div>
          </div>
          <div id="filter-chips" style="margin-top: var(--space-3);"></div>
        </section>

        <section aria-label="Ações de exportação" class="no-print">
          <div class="row-wrap gap-2" style="margin-bottom: var(--space-4);">
            <button type="button" class="btn btn-secondary btn-sm" id="export-csv-btn"><i data-lucide="file-text" class="icon icon-sm"></i> Exportar CSV</button>
            <button type="button" class="btn btn-secondary btn-sm" id="export-excel-btn"><i data-lucide="file-spreadsheet" class="icon icon-sm"></i> Exportar Excel</button>
            <button type="button" class="btn btn-secondary btn-sm" id="print-btn"><i data-lucide="printer" class="icon icon-sm"></i> Imprimir</button>
          </div>
        </section>

        <nav class="wizard-steps no-print" aria-label="Selecionar relatório" id="report-tabs"></nav>

        <div id="report-content"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="../js/pages/relatorios.js"></script>
</body>
</html>
