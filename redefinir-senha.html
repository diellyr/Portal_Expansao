<!doctype html>
<html lang="pt-BR">
<head>
  <script>(function(){try{if(localStorage.getItem("portal_expansao_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha — Portal Expansão</title>
  <meta name="description" content="Portal Expansão — Redefinir senha" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-card surface">
      <div class="login-brand">
        <div class="login-brand-mark">
          <img src="assets/images/logo.png" alt="Portal Expansão" />
        </div>
        <div>
          <h1 style="margin-bottom:2px;">Portal Expansão</h1>
          <p class="text-muted" style="margin:0;">Redefinir senha</p>
        </div>
      </div>

      <div id="redefinir-loading">
        <p class="text-muted">Verificando o link de redefinição...</p>
      </div>

      <form id="redefinir-form" novalidate hidden>
        <div class="form-group">
          <label class="required" for="new-password">Nova senha</label>
          <input class="form-control" type="password" id="new-password" autocomplete="new-password" required />
          <span class="form-error" id="new-password-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label class="required" for="confirm-password">Confirmar nova senha</label>
          <input class="form-control" type="password" id="confirm-password" autocomplete="new-password" required />
          <span class="form-error" id="confirm-password-error" aria-live="polite"></span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="redefinir-submit">
          <i data-lucide="check" class="icon icon-sm"></i> Salvar nova senha
        </button>
      </form>

      <div id="redefinir-invalid" hidden>
        <p class="text-muted">Este link de redefinição é inválido ou expirou. Peça um novo link na tela de login.</p>
        <a class="btn btn-secondary" style="width:100%; display:block; text-align:center;" href="index.html">Voltar para o login</a>
      </div>

      <div id="redefinir-success" hidden>
        <p class="text-muted">Senha alterada com sucesso.</p>
        <a class="btn btn-primary" style="width:100%; display:block; text-align:center;" href="index.html">Ir para o login</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/pages/redefinir-senha.js"></script>
</body>
</html>
