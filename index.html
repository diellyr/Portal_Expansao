<!doctype html>
<html lang="pt-BR">
<head>
  <script>(function(){try{if(localStorage.getItem("portal_expansao_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Expansão — Acesso</title>
  <meta name="description" content="Portal Expansão — Gestão Regional" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-card surface">
      <div class="login-brand">
        <div class="login-brand-mark">
          <img src="assets/images/logo.png" alt="Portal Expansão" />
        </div>
        <div>
          <h1 style="margin-bottom:2px;">Portal Expansão</h1>
          <p class="text-muted" style="margin:0;" id="login-subtitle">Gestão Regional</p>
          <p class="login-brand-version" id="app-version"></p>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="required" for="email" id="label-email">E-mail</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="username" required />
          <span class="form-error" id="email-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label class="required" for="password" id="label-password">Senha</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required />
          <span class="form-error" id="password-error" aria-live="polite"></span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="login-submit">
          <i data-lucide="log-in" class="icon icon-sm"></i> <span id="login-submit-label">Entrar</span>
        </button>
        <p style="text-align:center; margin-top: var(--space-3);">
          <a href="#" id="forgot-password-link">Esqueci minha senha</a>
        </p>
      </form>

      <p class="login-note">
        <span id="login-note-prefix">Login demonstrativo — sem autenticação real. Use</span>
        <strong>admin@portalexpansao.local</strong> / <strong>admin123</strong>.
        <span id="login-note-suffix">Os dados ficam salvos apenas neste navegador (IndexedDB).</span>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
